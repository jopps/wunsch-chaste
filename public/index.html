<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wunsch-Chaste 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Chewy&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:#4f8a6b; --accent-d:#3f7657; --accent-l:#e8f2ec;
    --ink:#3f3a4d; --muted:#8f8a9c; --line:#eee8e2; --card:#fff; --bg:#fbf8f4; --ok:#3f7657;
    --shadow:0 6px 24px rgba(80,60,50,.07);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--ink);
    font-family:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif; font-size:17px; line-height:1.4;
    background:radial-gradient(circle, rgba(95,156,127,.20) 2px, transparent 2.6px) 0 0/30px 30px, var(--bg);
  }
  .wrap { max-width:600px; margin:0 auto; padding:22px 16px 60px; }
  header { text-align:center; padding:10px 0 4px; }
  .brand { display:inline-flex; flex-direction:column; align-items:center; text-decoration:none; }
  .brand-icon {
    width:60px; height:60px; border-radius:50%; display:grid; place-items:center; font-size:30px;
    background:linear-gradient(145deg, #ffd166, #ff8a7a); border:4px solid #fff; box-shadow:0 6px 16px rgba(255,138,122,.35); transform:rotate(-6deg);
  }
  h1 { margin:8px 0 0; font-size:clamp(2rem,9vw,2.7rem); font-weight:700; letter-spacing:.3px; line-height:1.1;
    background:linear-gradient(90deg, #ff8a7a 0%, #ffb84d 30%, #5fbf94 65%, #6fb8f0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin:4px 0 0; color:var(--muted); font-weight:500; }
  .card { background:var(--card); border-radius:24px; padding:24px 22px; margin-top:20px; box-shadow:var(--shadow); }
  .card.alt { background:var(--card); }
  label { display:block; font-weight:600; margin:18px 0 8px; }
  input[type=text] {
    width:100%; padding:13px 16px; font:inherit; color:var(--ink); background:#fff;
    border:2px solid var(--line); border-radius:14px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]::placeholder { color:#bdb8c6; }
  input[type=text]:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-l); }
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip {
    padding:9px 18px; border:2px solid var(--line); border-radius:999px; background:#fff;
    font:inherit; font-weight:500; color:var(--ink); cursor:pointer; transition:all .15s;
  }
  .chip:hover { border-color:var(--accent); }
  .chip.on { background:var(--accent-l); border-color:var(--accent); color:var(--accent-d); font-weight:600; }
  .gift-row { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  .gift-row input { flex:1; min-width:0; }
  .btn {
    font:inherit; font-weight:600; color:#fff; cursor:pointer; border:0; border-radius:999px; padding:12px 24px;
    background:var(--accent); transition:background .15s, transform .1s;
  }
  .btn:hover { background:var(--accent-d); }
  .btn:active { transform:translateY(1px); }
  .btn.mint, .btn.blue { background:var(--accent); color:#fff; }
  .btn.mint:hover, .btn.blue:hover { background:var(--accent-d); }
  .btn.ghost { background:#fff; color:var(--ink); border:2px solid var(--line); }
  .btn.ghost:hover { border-color:var(--accent); background:#fff; }
  .btn.small { padding:9px 16px; font-size:.95rem; }
  .btn.blue { background:#fff; color:var(--accent-d); border:2px solid var(--accent-l); }
  .btn.blue:hover { background:var(--accent-l); }
  .btn.big { width:100%; font-size:1.1rem; margin-top:24px; padding:14px; }
  .x { flex:none; width:44px; height:44px; padding:0; border-radius:50%; background:#fff; color:var(--muted); border:2px solid var(--line); }
  .x:hover { color:var(--accent-d); border-color:var(--accent); background:#fff; }
  .err { color:#d0475a; font-weight:600; margin-top:12px; min-height:1em; }
  .title { font-size:1.5rem; font-weight:700; margin:0; line-height:1.2; }
  .badge { display:inline-block; background:var(--accent-l); color:var(--accent-d); font-weight:600; border-radius:999px; padding:5px 16px; margin-top:10px; }
  .gift {
    display:flex; align-items:center; gap:14px; padding:12px 14px; margin-top:10px;
    border-radius:18px; background:#fff; border:2px solid var(--line);
  }
  .gift .emo {
    flex:none; width:44px; height:44px; border-radius:50%; background:var(--accent-l);
    display:grid; place-items:center; font-size:1.4rem;
  }
  .gift .t { flex:1; font-weight:500; word-break:break-word; }
  .gift.taken { background:#faf8f6; border-color:transparent; }
  .gift.taken .emo { background:#eef5f2; }
  .gift.taken .t { color:var(--muted); }
  .gift.taken .t b { text-decoration:line-through; text-decoration-thickness:1.5px; font-weight:500; }
  .who { display:block; font-size:.85rem; font-weight:500; color:var(--ok); }
  .share { display:flex; gap:8px; margin-top:12px; }
  .share input { flex:1; min-width:0; font-size:.9rem; }
  .warn { background:#faf6f0; border-radius:14px; padding:12px 16px; margin-top:14px; font-size:.9rem; color:#7a6a55; }
  .mine a { display:block; margin-top:10px; font-weight:600; color:var(--accent-d); text-decoration:none; }
  .mine a:hover { text-decoration:underline; }
  .link { color:var(--accent-d); font-weight:600; text-decoration:none; }
  dialog { border:0; border-radius:24px; padding:26px; max-width:92vw; width:400px; color:var(--ink); font-family:inherit; box-shadow:0 24px 60px rgba(50,40,40,.25); }
  dialog::backdrop { background:rgba(50,40,50,.35); }
  .row { display:flex; gap:10px; margin-top:18px; }
  .row .btn { flex:1; }
  .center { text-align:center; }
  .hidden { display:none; }
  .confetti { position:fixed; top:-20px; font-size:26px; pointer-events:none; animation:fall 2.2s ease-in forwards; z-index:99; }
  @keyframes fall { to { transform:translateY(105vh) rotate(540deg); opacity:.9; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/" class="brand"><div class="brand-icon">🎁</div><h1 id="logo">Wunsch-Chaste</h1></a>
    <p class="sub">Wünsche sammeln, Geschenke teilen</p>
  </header>
  <main id="app"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 class="title" style="font-size:1.3rem">Das schenke ich! 🎁</h2>
    <p id="dlgGift" style="font-weight:600"></p>
    <label for="dlgName">Dein Name</label>
    <input type="text" id="dlgName" maxlength="40" placeholder="z.B. Tante Sabine" autocomplete="name">
    <div class="err" id="dlgErr"></div>
    <div class="row">
      <button type="button" class="btn ghost" id="dlgCancel">Abbrechen</button>
      <button type="submit" class="btn mint">Reservieren</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
